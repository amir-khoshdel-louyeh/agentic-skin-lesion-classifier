[pytest]
minversion = 8.0
testpaths = tests
# Fast tier is the default: deterministic tests with no model weights,
# GPU, Ollama or OpenClaw. Integration/live tiers are explicit opt-ins.
addopts = -m "not integration and not live"
markers =
    integration: requires the local triage checkpoint and model runtime
    live: requires a running OpenClaw/Ollama stack and model weights
