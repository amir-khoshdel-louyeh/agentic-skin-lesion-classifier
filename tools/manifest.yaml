version: 2
tools:
  - name: skin-lesion-mid
    command: tools/skin_lesion_mid.py
    status: ready
    category: diagnostic
    requires: [image]
    produces: [screening_verdict]
    modality: image
    # calibration/SUMMARY.md: acc 0.571, ECE 0.180 — fails the gate.
    calibrated: false
    vram_budget_gb: 1.5
    tier: tier2_mid

  - name: skin-lesion-high
    command: tools/skin_lesion_high.py
    status: ready
    category: diagnostic
    requires: [image]
    produces: [screening_verdict]
    modality: image
    # calibration/SUMMARY.md: acc 0.669, ECE 0.129 — fails the gate.
    calibrated: false
    vram_budget_gb: 2.0
    tier: tier3_high

  - name: ham10000-cnn
    command: tools/ham10000_cnn.py
    category: diagnostic
    requires: [image]
    produces: [screening_verdict]
    modality: image
    calibrated: true
    vram_budget_gb: 1.0
    tier: tier1_fast
    status: ready

  - name: quality-gate
    command: tools/quality_gate.py
    category: utility
    requires: [image]
    produces: [quality_assessment]
    modality: image
    calibrated: false
    vram_budget_gb: 0.0
    tier: utility

  - name: drdiag-vlm
    command: tools/drdiag_vlm.py
    category: diagnostic
    requires: [image]
    produces: [screening_verdict, explanation]
    modality: image+text
    calibrated: false
    vram_budget_gb: 5.0
    tier: tier3_high
    status: ready

  - name: multimodal-fusion
    command: tools/multimodal_fusion.py
    category: diagnostic
    requires: [image, metadata]
    produces: [screening_verdict]
    modality: image+metadata
    # calibration/SUMMARY.md: acc 0.644, ECE 0.105 — fails the gate.
    calibrated: false
    vram_budget_gb: 1.0
    tier: tier2_mid
    status: ready

  - name: abcde-analyzer
    command: tools/abcde_analyzer.py
    category: analysis
    requires: [image]
    produces: [abcde_assessment]
    modality: image
    calibrated: false
    vram_budget_gb: 0.0
    tier: support
    status: ready

  - name: preprocess
    command: tools/preprocess.py
    category: preprocessing
    requires: [image]
    produces: [cleaned_image]
    modality: image
    calibrated: false
    vram_budget_gb: 0.0
    tier: preprocessing
    status: ready

  - name: report-pdf
    command: tools/report_pdf.py
    category: reporting
    requires: [report]
    produces: [pdf_report]
    modality: text
    calibrated: false
    vram_budget_gb: 0.0
    tier: reporting
    status: ready

  - name: notify
    command: tools/notify.py
    category: notification
    requires: [message]
    produces: [notification_receipt]
    modality: text
    calibrated: false
    vram_budget_gb: 0.0
    tier: notification
    status: ready

  - name: dermai-b0
    command: tools/dermai_b0.py
    category: diagnostic
    requires: [image]
    produces: [screening_verdict]
    modality: image
    # calibration/SUMMARY.md: acc 0.571, ECE 0.180 — fails the gate.
    calibrated: false
    vram_budget_gb: 1.0
    tier: tier2_mid
    status: ready

  - name: vlm-ollama
    command: tools/vlm_ollama.py
    category: diagnostic
    requires: [image]
    produces: [screening_verdict]
    modality: image+text
    calibrated: false
    vram_budget_gb: 6.0
    tier: tier3_high
    status: ready

  - name: ensemble-high
    command: tools/ensemble_high.py
    category: diagnostic
    requires: [image, metadata]
    produces: [screening_verdict]
    modality: image+metadata
    # calibration/SUMMARY.md: acc 0.720, ECE 0.094, MEL recall 0.68
    # — fails the melanoma-sensitivity gate.
    calibrated: false
    vram_budget_gb: 2.0
    tier: tier3_high
    status: ready

  # Locally fine-tuned on ISIC2019 (7 covered classes; SCC excluded).
  # Weights are git-ignored; tools/train_isic.py rebuilds them.
  - name: isic-efficientnet-b4
    command: tools/isic_efficientnet_b4.py
    category: diagnostic
    requires: [image]
    produces: [screening_verdict]
    modality: image
    # calibration/SUMMARY.md: acc 0.646, ECE 0.078, MEL recall 0.80.
    calibrated: true
    vram_budget_gb: 1.5
    tier: tier2_mid
    status: ready

  - name: isic-resnet50
    command: tools/isic_resnet50.py
    category: diagnostic
    requires: [image]
    produces: [screening_verdict]
    modality: image
    # calibration/SUMMARY.md: acc 0.731, ECE 0.065, MEL recall 0.80.
    calibrated: true
    vram_budget_gb: 1.5
    tier: tier2_mid
    status: ready

  - name: isic-vit
    command: tools/isic_vit.py
    category: diagnostic
    requires: [image]
    produces: [screening_verdict]
    modality: image
    # calibration/SUMMARY.md: acc 0.720, ECE 0.079, MEL recall 0.80.
    calibrated: true
    vram_budget_gb: 2.0
    tier: tier3_high
    status: ready

  # Support tier: boundary evidence, not a vote. MedSAM (SAM ViT-B).
  - name: lesion-segmentation
    command: tools/lesion_segmentation.py
    category: analysis
    requires: [image]
    produces: [lesion_mask, segmentation_metrics]
    modality: image
    calibrated: false
    vram_budget_gb: 3.0
    tier: support
    status: ready
