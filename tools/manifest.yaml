version: 2
tools:
  - name: skin-lesion-fast
    command: tools/skin_lesion_fast.py
    status: no_weights
    category: diagnostic
    requires: [image]
    produces: [screening_verdict]
    modality: image
    calibrated: false
    vram_budget_gb: 1.0
    tier: tier1_fast

  - name: skin-lesion-mid
    command: tools/skin_lesion_mid.py
    status: no_weights
    category: diagnostic
    requires: [image]
    produces: [screening_verdict]
    modality: image
    calibrated: false
    vram_budget_gb: 1.5
    tier: tier2_mid

  - name: skin-lesion-high
    command: tools/skin_lesion_high.py
    status: no_weights
    category: diagnostic
    requires: [image]
    produces: [screening_verdict]
    modality: image
    calibrated: false
    vram_budget_gb: 2.0
    tier: tier3_high

  - name: ham10000-cnn
    command: tools/ham10000_cnn.py
    category: diagnostic
    requires: [image]
    produces: [screening_verdict]
    modality: image
    calibrated: false
    vram_budget_gb: 1.0
    tier: tier1_fast
    status: ready

  - name: quality-gate
    command: tools/quality_gate.py
    category: utility
    requires: [image]
    produces: [quality_assessment]
    modality: image
    calibrated: false
    vram_budget_gb: 0.0
    tier: utility

  - name: drdiag-vlm
    command: tools/drdiag_vlm.py
    category: diagnostic
    requires: [image]
    produces: [screening_verdict, explanation]
    modality: image+text
    calibrated: false
    vram_budget_gb: 5.0
    tier: tier3_high
    status: rejected_benchmark

  - name: multimodal-fusion
    command: tools/multimodal_fusion.py
    category: diagnostic
    requires: [image, metadata]
    produces: [screening_verdict]
    modality: image+metadata
    calibrated: true
    vram_budget_gb: 1.0
    tier: tier2_mid
    status: ready
